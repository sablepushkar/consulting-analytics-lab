name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m compileall -q src tests scripts
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Generate example case report
        env:
          PYTHONPATH: src
        run: python -m analytics_lab.case_runner cases/profitability/case.json > "$RUNNER_TEMP/profitability-case.txt"
      - name: Show example case report
        run: cat "$RUNNER_TEMP/profitability-case.txt"
      - name: Upload example case report
        uses: actions/upload-artifact@v7
        with:
          name: consulting-analytics-case-${{ github.sha }}
          path: ${{ runner.temp }}/profitability-case.txt
          if-no-files-found: error
          retention-days: 30
